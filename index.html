<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
 <style>
   .div-image img {
  width: 300px;
height: 499px;
  object-fit: cover;
  border-top-left-radius: 20px;
  border-bottom-left-radius: 20px;
}

.container {
    display: flex;
    justify-content: center;
   align-items: center;
    justify-items: center;
    align-content: center;
    

}

.div-text {
background: white;
width: 300px;
height: 499px;
border-top-right-radius: 20px;
border-bottom-right-radius: 20px;
}

.div-block {
    display:flex;
    align-items: center;
    justify-items: center;
    justify-content: center;
    flex-direction: column;
}

.div-price {
    display: flex;
    justify-content: space-evenly;
    gap: 20px;

}

body {
  font-family: 'Montserrat', sans-serif;
  background-color: hsl(30, 38%, 92%);
  margin: 100px;
  padding: 100px;
  
}

.div-price h1 {
    color:  hsl(158, 36%, 37%);
}

.add-card a {
    text-decoration: none;
    background-color:  hsl(158, 36%, 37%);
    border-radius: 10px;
    color:white;
    padding: 20px;
   
    border: 2px solid green;
}

.add-card a::before {
   content: url(images/icon-cart.svg);
   margin-right: 10px;
    
}

.add-card {
margin: 20px;
padding: 20px;
}

.attribution {
  font-size: 15px;
  text-align: center;
  margin: 20px;
}
 </style>
</head>
<body>
<div class="container">

  <div class="div-image">
  <img src="images/image-product-desktop.jpg" alt="perfume">
  </div>

  <div class="div-text div-block">
  <h2><em>Perfume</em></h2>

  <h1>Gabrielle<br> Essence Eau<br> De Parfum</h1>

  <p>A floral, solar and voluptuous<br> interpretation composed by<br> Olivier Polge, 
  Perfumer-Creator<br> for the House of CHANEL.</p>
<div class="div-price">
  <h1>$149.99</h1>
  <p>$169.99</p>
  </div>

  <p class="add-card"><a href="">Add to Cart</a></p>
  </div>

  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">DYLANE MATELO</a>.
  </footer>
</body>
</html>
