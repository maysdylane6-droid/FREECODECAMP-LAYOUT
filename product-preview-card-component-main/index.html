<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
 <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

  <div class="div-image">
  <img src="images/image-product-desktop.jpg" alt="perfume">
  </div>

  <div class="div-text div-block">
  <h2><em>Perfume</em></h2>

  <h1>Gabrielle<br> Essence Eau<br> De Parfum</h1>

  <p>A floral, solar and voluptuous<br> interpretation composed by<br> Olivier Polge, 
  Perfumer-Creator<br> for the House of CHANEL.</p>
<div class="div-price">
  <h1>$149.99</h1>
  <p>$169.99</p>
  </div>

  <p class="add-card"><a href="">Add to Cart</a></p>
  </div>

  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">DYLANE MATELO</a>.
  </footer>
</body>
</html>
